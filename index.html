<!doctype html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>이주연 | AI·백엔드 개발자</title>
  <meta name="description" content="RAG 챗봇과 데이터 파이프라인을 만드는 개발자 이주연의 포트폴리오입니다.">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0A0A0F">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234F6EF7'/%3E%3Ctext x='16' y='22' font-size='17' font-family='monospace' font-weight='700' text-anchor='middle' fill='white'%3E%26gt;_%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=Noto+Sans+KR:wght@300;400;500;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script>
    /* Dark is the default. Set theme before first paint to avoid a flash. */
    (function () {
      var d = document.documentElement, t = null;
      d.classList.add("js");
      try { t = localStorage.getItem("theme"); } catch (e) {}
      d.setAttribute("data-theme", t === "light" ? "light" : "dark");
    })();
  </script>
</head>
<body>
  <a class="skip" href="#main" data-i18n="ui.skip">본문으로 건너뛰기</a>

  <nav class="nav" id="nav">
    <div class="container nav-inner">
      <a class="logo" href="#top" aria-label="Home">JY<span class="logo-dot">.</span></a>

      <ul class="nav-links" id="navLinks">
        <li><a href="#about" data-i18n="nav.about">소개</a></li>
        <li><a href="#skills" data-i18n="nav.skills">기술</a></li>
        <li><a href="#projects" data-i18n="nav.projects">프로젝트</a></li>
        <li><a href="#journey" data-i18n="nav.journey">Timeline</a></li>
        <li><a href="#contact" data-i18n="nav.contact">연락</a></li>
      </ul>

      <div class="nav-tools">
        <div class="lang" id="lang">
          <button class="tool-btn" id="langBtn" type="button" aria-haspopup="true" aria-expanded="false"
                  data-i18n-attr="aria-label:ui.lang;title:ui.lang">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.6 3.9 5.6 3.9 9s-1.3 6.4-3.9 9c-2.6-2.6-3.9-5.6-3.9-9S9.4 5.6 12 3z"/></svg>
            <span id="langCode">KO</span>
          </button>
          <ul class="lang-menu" id="langMenu" role="menu">
            <li><button type="button" role="menuitem" data-lang="ko">한국어</button></li>
            <li><button type="button" role="menuitem" data-lang="en">English</button></li>
            <li><button type="button" role="menuitem" data-lang="zh">中文</button></li>
            <li><button type="button" role="menuitem" data-lang="ja">日本語</button></li>
          </ul>
        </div>

        <button class="tool-btn icon-only" id="themeBtn" type="button" data-i18n-attr="aria-label:ui.theme;title:ui.theme">
          <svg class="i-sun" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="i-moon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>

        <button class="tool-btn icon-only menu-btn" id="menuBtn" type="button" aria-expanded="false" aria-controls="navLinks"
                data-i18n-attr="aria-label:ui.menu">
          <span class="bars" aria-hidden="true"><i></i><i></i><i></i></span>
        </button>
      </div>
    </div>
  </nav>

  <main id="main">
    <!-- HERO -->
    <section class="hero" id="top">
      <div class="hero-grid" aria-hidden="true"></div>
      <div class="hero-glow" aria-hidden="true"></div>
      <div class="container hero-inner">
        <div class="hero-copy">
        <p class="eyebrow" data-i18n="hero.eyebrow">RAG · LLM</p>
        <h1 class="hero-title">
          <span data-i18n="hero.name">이주연</span><span class="cursor" aria-hidden="true"></span>
        </h1>
        <p class="hero-role" data-i18n="hero.role">AI · 백엔드 개발자</p>
        <p class="hero-tagline" data-i18n="hero.tagline"></p>
        <div class="hero-actions">
          <a class="btn btn-primary" href="#projects" data-i18n="hero.cta1">프로젝트 보기</a>
          <a class="btn btn-ghost" href="#contact" data-i18n="hero.cta2">연락하기</a>
          <a class="btn btn-ghost" href="https://github.com/jynlee" target="_blank" rel="noopener">GitHub →</a>
        </div>
        <dl class="hero-stats">
          <div><dt id="statProjects">0</dt><dd data-i18n="about.stats.projects"></dd></div>
          <div><dt id="statAreas">0</dt><dd data-i18n="about.stats.areas"></dd></div>
        </dl>
        </div>
      </div>
      <a class="scroll-hint" href="#about" aria-label="scroll">
        <span data-i18n="ui.scroll">scroll</span>
        <i aria-hidden="true"></i>
      </a>
    </section>

    <!-- ABOUT -->
    <section class="section" id="about">
      <div class="container">
        <div class="section-head reveal">
          <span class="section-label" data-i18n="about.label">About Me</span>
        </div>
        <div class="about-grid">
          <div class="about-photo reveal"><img src="assets/profile-2d.jpg" alt="이주연 2D 캐릭터 프로필" width="900" height="806" loading="lazy"></div>
          <div class="about-text reveal">
            <h2 class="section-title pre" data-i18n="about.title"></h2>
            <p data-i18n="about.p2"></p>
            <p data-i18n="about.p3"></p>
            <dl class="facts">
              <div><dt data-i18n="about.facts.focus.l"></dt><dd data-i18n="about.facts.focus.v"></dd></div>
              <div><dt data-i18n="about.facts.edu.l"></dt><dd data-i18n="about.facts.edu.v"></dd></div>
            </dl>
          </div>
        </div>
      </div>
    </section>
    <!-- SKILLS -->
    <section class="section alt" id="skills">
      <div class="container">
        <div class="section-head reveal">
          <span class="section-label" data-i18n="skills.label">What I Work With</span>
          <h2 class="section-title" data-i18n="skills.title">기술 스택</h2>
        </div>
        <div class="skills-grid" id="skillsGrid"></div>
      </div>
    </section>

    <!-- PROJECTS -->
    <section class="section" id="projects">
      <div class="container">
        <div class="section-head reveal">
          <span class="section-label" data-i18n="projects.label">Selected Work</span>
          <h2 class="section-title" data-i18n="projects.title">프로젝트</h2>
        </div>
        <div class="filters reveal" id="filters" role="group">
          <button class="filter active" type="button" data-filter="all" data-i18n="projects.filter.all">전체</button>
          <button class="filter" type="button" data-filter="ai" data-i18n="projects.filter.ai">AI</button>
          <button class="filter" type="button" data-filter="data" data-i18n="projects.filter.data">데이터</button>
          <button class="filter" type="button" data-filter="web" data-i18n="projects.filter.web">웹</button>
        </div>
        <div class="project-grid" id="projectGrid"></div>
      </div>
    </section>

    <!-- JOURNEY -->
    <section class="section alt" id="journey">
      <div class="container">
        <div class="section-head reveal">
          <span class="section-label" data-i18n="journey.label">Career</span>
          <h2 class="section-title" data-i18n="journey.title">Timeline</h2>
        </div>
        <div class="timeline" id="timeline"></div>
      </div>
    </section>

    <!-- CONTACT -->
    <section class="section contact" id="contact">
      <div class="container reveal">
        <span class="section-label" data-i18n="contact.label">Get In Touch</span>
        <h2 class="section-title" data-i18n="contact.title">좋은 서비스는 대화에서 시작됩니다</h2>
        <p class="contact-lead" data-i18n="contact.lead"></p>
        <ul class="contact-list" id="contactList"></ul>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p data-i18n="footer.note">Designed &amp; Built by 이주연</p>
      <a class="to-top" href="#top" data-i18n="ui.top">맨 위로</a>
    </div>
  </footer>

  <script src="js/i18n/ko.js"></script>
  <script src="js/i18n/en.js"></script>
  <script src="js/i18n/zh.js"></script>
  <script src="js/i18n/ja.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
